<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FibreGems - Agent Dashboard</title>
    <meta name="description" content="FibreGems agent dashboard for daily clock-in and field activity tracking." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    <link rel="dns-prefetch" href="https://script.google.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: { preflight: false },
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#E07C2A',
                light: '#F1A328',
                dark: '#CE5926',
                tint: '#F2D5BE',
              }
            },
            fontFamily: {
              sans: ['Montserrat', 'system-ui', '-apple-system', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../../shared/styles.css" />
  </head>

  <body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen">
    <div id="toast-container"></div>
    <div id="lightbox" onclick="closeLightbox()">
      <img id="lightbox-img" src="" alt="Photo proof" />
    </div>
    <div id="global-loader" class="hidden">
      <div class="animate-spin rounded-full h-11 w-11 border-4 border-brand border-t-transparent mb-3"></div>
      <p class="text-sm font-semibold text-brand-light">Connecting to Operations Center</p>
    </div>

    <div id="appView" class="flex flex-col min-h-screen w-full">
      <!-- HEADER (Option 1: Sleek Horizontal Brand Row) -->
      <header class="bg-[#0f172a] text-[#f8fafc] fixed w-full top-0 z-50 shadow-md border-b border-[#1e293b]">
        <div class="w-full px-3 sm:px-4 h-14 sm:h-16 flex justify-between items-center">
          <div class="flex items-center gap-2 sm:gap-3">
            <img src="../../assets/logo.jpg" alt="FibreGems Logo" class="h-8 sm:h-12 w-auto object-contain rounded drop-shadow" />
            <div class="flex flex-col justify-center">
              <span class="text-[11px] sm:text-sm font-bold tracking-tight text-white leading-tight whitespace-nowrap">FibreGems Field Ops</span>
              <span class="text-[9px] sm:text-[11px] text-brand-light font-semibold tracking-wide whitespace-nowrap">Agent Field Dashboard</span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span id="current-date-display" class="hidden sm:inline-block text-[11px] font-semibold bg-white/10 px-2.5 py-1.5 rounded-full border border-white/10 tracking-wide"></span>
            <button onclick="logout()" class="text-[10px] sm:text-[11px] font-bold bg-red-500/80 hover:bg-red-600 px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full tracking-wide transition shadow-sm border border-red-400">
              Log Out
            </button>
          </div>
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <main class="flex-grow max-w-5xl w-full mx-auto px-4 pt-20 pb-2">

        <!-- ══════════════════════════════════════
             TAB 1: LOG IN
        ══════════════════════════════════════ -->
        <div id="tab-login" class="tab-panel active space-y-3 max-w-md mx-auto">
          <!-- Location status bar -->
          <div class="flex items-center justify-between">
            <span id="login-location-chip" class="location-chip loading">
              <i data-lucide="map-pin" style="width:12px;height:12px;flex-shrink:0;display:inline"></i>
              Capturing location…
            </span>
            <button onclick="manualRefreshGPS()" class="text-[11px] text-brand font-semibold flex items-center gap-1 hover:text-brand-light py-1">
              <i data-lucide="refresh-cw" style="width:11px;height:11px"></i> Refresh GPS
            </button>
          </div>

          <!-- Clock-in card -->
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="bg-gradient-to-r from-[#0f172a] to-[#1e293b] px-5 py-4 border-b border-[#334155]">
              <h2 class="text-white text-base font-bold">Agent Daily Hub</h2>
              <p class="text-[#94a3b8] text-[11px] mt-0.5">Clock-in &amp; log your daily field activity</p>
            </div>
            <div class="p-5 space-y-4">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Your Name</label>
                  <input type="text" id="agent-name" placeholder="e.g. Thabo M." class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm transition" />
                </div>
                <div>
                  <label class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Team Leader</label>
                  <select id="agent-leader-select" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white transition">
                    <option value="">-- Select --</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Active Fibrehood / Location</label>
                <div class="flex gap-2">
                  <input type="text" id="agent-location" placeholder="Auto-filling from GPS…" class="flex-1 px-3 py-2.5 border border-gray-200 rounded-xl text-sm transition" />
                  <button onclick="manualRefreshGPS()" title="Capture GPS" class="px-3 py-2.5 bg-brand/10 border border-brand/30 rounded-xl text-brand hover:bg-brand/20 transition flex-shrink-0">
                    <i data-lucide="map-pin" class="w-4 h-4"></i>
                  </button>
                </div>
                <input type="hidden" id="agent-gps" />
                <input type="hidden" id="agent-resolved-location" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Clock-In Selfie</label>
                <label id="agent-photo-area" class="photo-area border-2 border-dashed border-gray-200 rounded-xl h-28 flex flex-col items-center justify-center cursor-pointer overflow-hidden relative">
                  <div id="agent-photo-preview-wrap" class="hidden absolute inset-0">
                    <img id="agent-photo-preview" src="" alt="" class="w-full h-full object-cover" />
                  </div>
                  <div id="agent-photo-placeholder" class="flex flex-col items-center gap-1.5 z-10">
                    <i data-lucide="camera" class="w-6 h-6 text-gray-400"></i>
                    <span class="text-[11px] font-medium text-gray-500">Tap to take selfie</span>
                  </div>
                  <input type="file" accept="image/*" capture="user" class="hidden" onchange="previewPhoto(event, 'agent')" />
                </label>
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Task Notes</label>
                <textarea id="agent-notes" placeholder="Brief summary of today's plan…" rows="2" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm transition resize-none"></textarea>
              </div>
              <button onclick="submitAgentClockIn()" id="agent-submit-btn" class="w-full bg-gradient-to-r from-brand-dark to-brand text-[#0f172a] text-sm font-bold py-3 rounded-xl hover:from-brand hover:to-brand-light active:scale-[.98] transition-all flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i>Submit Clock-In
              </button>
            </div>
          </div>
        </div>

        <!-- ══════════════════════════════════════
             TAB 2: OBJECTIVES
        ══════════════════════════════════════ -->
        <div id="tab-objectives" class="tab-panel space-y-3 max-w-md mx-auto">
          <!-- Location status bar -->
          <div class="flex items-center justify-between">
            <span id="obj-location-chip" class="location-chip loading">
              <i data-lucide="map-pin" style="width:12px;height:12px;flex-shrink:0;display:inline"></i>
              Capturing location…
            </span>
            <button onclick="fetchAllPortalData(false)" class="text-[11px] text-brand font-semibold flex items-center gap-1 hover:text-brand-light py-1">
              <i data-lucide="refresh-cw" style="width:11px;height:11px"></i> Refresh
            </button>
          </div>

          <!-- Objectives card -->
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="bg-gradient-to-r from-[#0f172a] to-[#1e293b] px-5 py-4 border-b border-[#334155]">
              <h2 class="text-white text-base font-bold">Team Objectives</h2>
              <p class="text-[#94a3b8] text-[11px] mt-0.5">Objectives set by your Team Leader &amp; Admin</p>
            </div>
            <div id="agent-objectives-list" class="p-5 space-y-3">
              <div class="text-center py-6">
                <div class="animate-spin rounded-full h-6 w-6 border-2 border-brand border-t-transparent mx-auto mb-2"></div>
                <p class="text-[11px] text-gray-400">Loading objectives…</p>
              </div>
            </div>
          </div>
        </div>

      </main>

      <!-- ══════════════════════════════════════
           BOTTOM NAVIGATION (2 TABS)
      ══════════════════════════════════════ -->
      <nav class="bottom-nav">
        <button id="nav-login" class="bottom-nav-btn active" onclick="switchTab('login')">
          <span class="nav-indicator"></span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          <span class="nav-label">Log In</span>
        </button>
        <button id="nav-objectives" class="bottom-nav-btn" onclick="switchTab('objectives')">
          <span class="nav-indicator"></span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          <span class="nav-label">Objectives</span>
        </button>
      </nav>
    </div>

    <script src="../../shared/api.js"></script>
    <script src="../../shared/utils.js"></script>
    <script src="../../shared/auth.js"></script>
    <script src="agent.js"></script>
    <script>
      lucide.createIcons();
      document.getElementById("current-date-display").innerText = new Date().toLocaleDateString("en-ZA", {
        weekday: "short", day: "numeric", month: "short"
      });
    </script>
  </body>
</html>
