<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FibreGems Field Activity Tracker - Login</title>
    <meta
      name="description"
      content="FibreGems mobile-first field operations tracker for fiber sales agents and team leaders across South African fibrehoods."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    <link rel="dns-prefetch" href="https://script.google.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false,
      },
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#E07C2A',
              light: '#F1A328',
              dark: '#CE5926',
              tint: '#F2D5BE',
            }
          },
          fontFamily: {
            sans: ['Montserrat', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="shared/styles.css" />
  </head>

  <body class="bg-[#0f172a] text-[#f8fafc] antialiased min-h-screen">
    <div id="toast-container"></div>
    <div id="global-loader" class="hidden">
      <div
        class="animate-spin rounded-full h-11 w-11 border-4 border-[#f59e0b] border-t-transparent mb-3"
      ></div>
      <p class="text-sm font-semibold text-[#fbbf24]">
        Connecting to Operations Center
      </p>
    </div>

    <!-- AUTHENTICATION VIEW -->
    <div
      id="authView"
      class="min-h-screen flex items-center justify-center p-4"
    >
      <div
        class="bg-[#1e293b] rounded-2xl shadow-xl w-full max-w-md p-6 border border-[#334155]"
      >
        <div class="text-center mb-6">
          <img src="assets/logo.jpg" alt="FibreGems Logo" class="h-16 sm:h-20 w-auto mx-auto mb-2 object-contain rounded-xl drop-shadow-lg" />
          <p class="text-sm text-[#94a3b8] font-medium">Field Operations Portal</p>
        </div>

        <div
          id="authAlert"
          class="hidden mb-4 p-3 rounded-xl text-sm font-semibold text-center"
        ></div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label
              class="block text-xs font-semibold text-[#94a3b8] uppercase mb-1"
              >Email Address</label
            ><input
              type="email"
              id="loginEmail"
              required
              class="w-full px-3 py-2 border border-[#334155] bg-[#0f172a] text-[#f8fafc] rounded-xl text-sm transition"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-[#94a3b8] uppercase mb-1"
              >Password</label
            ><input
              type="password"
              id="loginPassword"
              required
              class="w-full px-3 py-2 border border-[#334155] bg-[#0f172a] text-[#f8fafc] rounded-xl text-sm transition"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-gradient-to-r from-[#d97706] to-[#f59e0b] text-[#0f172a] font-bold py-3 rounded-xl hover:from-[#f59e0b] hover:to-[#fbbf24] active:scale-[.98] transition shadow-lg shadow-amber-900/20"
          >
            Log In
          </button>
          <p class="text-center text-xs text-[#94a3b8] mt-4">
            New Agent or Leader?
            <a
              href="#"
              onclick="toggleAuth('register')"
              class="text-[#f59e0b] font-bold hover:text-[#fbbf24]"
              >Register here</a
            >
          </p>
        </form>

        <form
          id="registerForm"
          onsubmit="handleRegister(event)"
          class="space-y-4 hidden"
        >
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label
                class="block text-xs font-semibold text-[#94a3b8] uppercase mb-1"
                >First Name</label
              ><input
                type="text"
                id="regFirstName"
                required
                class="w-full px-3 py-2 border border-[#334155] bg-[#0f172a] text-[#f8fafc] rounded-xl text-sm transition"
              />
            </div>
            <div>
              <label
                class="block text-xs font-semibold text-[#94a3b8] uppercase mb-1"
                >Last Name</label
              ><input
                type="text"
                id="regLastName"
                required
                class="w-full px-3 py-2 border border-[#334155] bg-[#0f172a] text-[#f8fafc] rounded-xl text-sm transition"
              />
            </div>
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-[#94a3b8] uppercase mb-1"
              >Email Address</label
            ><input
              type="email"
              id="regEmail"
              required
              class="w-full px-3 py-2 border border-[#334155] bg-[#0f172a] text-[#f8fafc] rounded-xl text-sm transition"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-[#94a3b8] uppercase mb-1"
              >Password</label
            ><input
              type="password"
              id="regPassword"
              required
              minlength="6"
              class="w-full px-3 py-2 border border-[#334155] bg-[#0f172a] text-[#f8fafc] rounded-xl text-sm transition"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-gradient-to-r from-[#d97706] to-[#f59e0b] text-[#0f172a] font-bold py-3 rounded-xl hover:from-[#f59e0b] hover:to-[#fbbf24] active:scale-[.98] transition shadow-lg shadow-amber-900/20"
          >
            Create Account
          </button>
          <p class="text-center text-xs text-[#94a3b8] mt-4">
            Already registered?
            <a
              href="#"
              onclick="toggleAuth('login')"
              class="text-[#f59e0b] font-bold hover:text-[#fbbf24]"
              >Log In</a
            >
          </p>
        </form>
      </div>
    </div>

    <script src="shared/api.js"></script>
    <script src="shared/utils.js"></script>
    <script src="shared/auth.js"></script>
    <script>
      lucide.createIcons();

      // Override handleLogin and handleRegister to pass postData function
      async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        const res = await postData("loginUser", { email, password });
        
        if (res && res.status === "success" && res.user) {
          const user = res.user;
          saveSession(user);
          redirectToDashboard(user.accountType);
        } else if (res) {
          showAuthAlert(res.message || "Invalid API response. User data missing.", "error");
        }
      }

      async function handleRegister(e) {
        e.preventDefault();
        const firstName = document.getElementById("regFirstName").value.trim();
        const lastName = document.getElementById("regLastName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const password = document.getElementById("regPassword").value;
        const res = await postData("registerUser", {
          firstName,
          lastName,
          email,
          password,
        });
        
        if (res && res.status === "success") {
          showAuthAlert(res.message, "success");
          toggleAuth("login");
          document.getElementById("registerForm").reset();
        } else if (res) {
          showAuthAlert(res.message, "error");
        }
      }

      // Check if user is already logged in and redirect
      window.addEventListener('DOMContentLoaded', () => {
        const session = getSession();
        if (session) {
          redirectToDashboard(session.accountType);
        }
      });
    </script>
  </body>
</html>
